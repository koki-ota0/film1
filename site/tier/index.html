<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>映画ティア表メーカー｜EigaKit</title>
<style>
:root{--bg:#0b0b0f;--panel:#17171e;--line:#2a2a35;--text:#f2efe8;--muted:#a8a39a;--accent:#e8c468;--sans:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif}
*,*::before,*::after{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#2a2112,transparent 60%),var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6}
.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 40px}
h1{font-family:var(--serif);font-size:clamp(1.8rem,5vw,3rem);margin:.2em 0 .2em;line-height:1.2}
.lead{color:var(--muted);margin:0 0 24px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px}
.panel h2{font-size:1rem;margin:0 0 14px;color:#ddd5c8}
.board{border:1px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden;background:#101015}
.tier{display:grid;grid-template-columns:92px 1fr;min-height:86px;border-bottom:1px solid #101015}
.tier:last-child{border-bottom:none}
.tier-label{display:flex;align-items:center;justify-content:center;font:800 2rem/1 var(--serif);color:#111;text-align:center;padding:8px}
.tier-items{display:flex;flex-wrap:wrap;gap:8px;padding:10px;min-height:86px;align-content:flex-start;background:#181820}
.tier-items.drag-over{outline:2px dashed rgba(232,196,104,.7);outline-offset:-4px;background:#1d1d28}
.item{width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.12);background:#252532;cursor:grab;position:relative;flex:0 0 auto;user-select:none}
.item.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,196,104,.25)}
.item img{width:100%;height:100%;object-fit:cover;display:block}
.item .txt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:.72rem;font-weight:700;line-height:1.3;color:#f2efe8;word-break:break-word}
.item button.del{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:none}
.item:hover button.del,.item.selected button.del{display:block}
.pool-wrap{margin-top:16px}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;min-height:92px;border-radius:14px;border:1px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.02)}
.pool.drag-over{outline:2px dashed rgba(232,196,104,.7);outline-offset:-4px}
.add-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-top:14px}
.add-row input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0f0f14;color:var(--text);font:inherit}
.add-row input[type=text]:focus{outline:2px solid rgba(232,196,104,.45);border-color:rgba(232,196,104,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;border:1px solid transparent;font:700 .88rem var(--sans);cursor:pointer;text-decoration:none;transition:transform .15s;background:none;color:var(--text)}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#f0d78a);color:#1a1408}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text);border-color:rgba(255,255,255,.12)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.small{font-size:.78rem;color:var(--muted);margin-top:10px;line-height:1.6}
.preview{position:sticky;top:20px}
.canvas-wrap{background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:#0b0b0f}
.hint{font-size:.8rem;color:var(--muted);margin:10px 0 0}
@media (max-width:980px){.layout{grid-template-columns:1fr}.preview{position:static}}
@media (max-width:640px){.panel{padding:16px}.tier{grid-template-columns:72px 1fr;min-height:74px}.tier-label{font-size:1.6rem}.item{width:64px;height:64px}.add-row{grid-template-columns:1fr 1fr}.add-row input[type=text]{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <p style="color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin:0">EigaKit Template</p>
  <h1>映画ティア表メーカー</h1>
  <p class="lead">観た映画をS〜Dに並べて、議論が始まる1枚をつくろう。スマホは「アイテムをタップ → 段をタップ」で移動できます。</p>

  <div class="layout">
    <div class="panel">
      <div class="field" style="margin-bottom:14px">
        <label for="boardTitle" style="display:block;font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:6px">ティア表のタイトル</label>
        <input id="boardTitle" type="text" maxlength="30" value="映画ティア表" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0f0f14;color:var(--text);font:inherit">
      </div>

      <div class="board" id="board"></div>

      <div class="pool-wrap">
        <h2 style="font-size:1rem;margin:0 0 10px;color:#ddd5c8">未分類のアイテム</h2>
        <div class="pool" id="pool" data-tier="pool"></div>
        <p class="hint">アイテムをタップすると選択状態になります。もう一度タップで解除。選択中に段をタップすると移動します。</p>
      </div>

      <div class="add-row">
        <input id="newText" type="text" maxlength="30" placeholder="映画タイトルを入力">
        <button class="btn btn-primary" id="addText" type="button">追加</button>
        <label class="btn btn-ghost file-btn">画像追加<input id="addImg" type="file" accept="image/*" multiple></label>
      </div>
    </div>

    <div class="preview">
      <div class="panel">
        <h2>プレビュー</h2>
        <div class="canvas-wrap"><canvas id="c" width="1080" height="1350"></canvas></div>
        <div class="stack">
          <button class="btn btn-primary" id="dl" type="button">画像を保存</button>
          <a class="btn btn-ghost" id="share" href="#" target="_blank" rel="noopener">Xでシェア</a>
        </div>
        <p class="small">画像は端末内で生成されます。「Xでシェア」はテキスト投稿画面を開くので、保存した画像を添付してください。</p>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const TIERS = [
    {id:'S', color:'#ff7a7a'},
    {id:'A', color:'#ffb36b'},
    {id:'B', color:'#ffd166'},
    {id:'C', color:'#8fd694'},
    {id:'D', color:'#7ab8ff'},
  ];
  const board = document.getElementById('board');
  const pool = document.getElementById('pool');
  const titleInput = document.getElementById('boardTitle');
  const newText = document.getElementById('newText');
  const addText = document.getElementById('addText');
  const addImg = document.getElementById('addImg');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const share = document.getElementById('share');

  let items = []; // {id,type,text,src,img,tier}
  let selectedId = null;
  let nextId = 1;

  function uid(){ return nextId++; }

  function addTextItem(text){
    const t = text.trim(); if(!t) return;
    items.push({id:uid(), type:'text', text:t, src:'', img:null, tier:'pool'});
    newText.value='';
    render();
  }
  function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
  function loadImage(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
  async function addImageFiles(files){
    for(const f of files){
      if(!f.type.startsWith('image/')) continue;
      const src = await readAsDataURL(f);
      const img = await loadImage(src);
      items.push({id:uid(), type:'image', text:'', src, img, tier:'pool'});
    }
    render();
  }

  addText.addEventListener('click', ()=>addTextItem(newText.value));
  newText.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTextItem(newText.value); } });
  addImg.addEventListener('change', async e=>{ const fs=[...(e.target.files||[])]; if(fs.length) await addImageFiles(fs); e.target.value=''; });
  titleInput.addEventListener('input', draw);

  function tierItems(tierId){ return items.filter(it=>it.tier===tierId); }

  function moveItem(id, tierId){
    const it = items.find(x=>x.id===id); if(!it) return;
    it.tier = tierId;
    selectedId = null;
    render();
  }
  function deleteItem(id){
    items = items.filter(x=>x.id!==id);
    if(selectedId===id) selectedId=null;
    render();
  }

  function itemEl(it){
    const el = document.createElement('div');
    el.className = 'item' + (selectedId===it.id ? ' selected' : '');
    el.draggable = true;
    el.dataset.id = String(it.id);
    if(it.type==='image'){
      const im = document.createElement('img'); im.src = it.src; im.alt = it.text || 'movie'; el.appendChild(im);
    } else {
      const t = document.createElement('div'); t.className='txt'; t.textContent = it.text; el.appendChild(t);
    }
    const del = document.createElement('button'); del.className='del'; del.type='button'; del.setAttribute('aria-label','削除'); del.textContent='×';
    del.addEventListener('click', (e)=>{ e.stopPropagation(); deleteItem(it.id); });
    el.appendChild(del);

    el.addEventListener('click', (e)=>{
      if(e.target.closest('.del')) return;
      selectedId = (selectedId === it.id) ? null : it.id;
      render();
    });
    el.addEventListener('dragstart', (e)=>{ e.dataTransfer.setData('text/plain', String(it.id)); e.dataTransfer.effectAllowed='move'; });
    return el;
  }

  function bindDropZone(zone, tierId){
    zone.dataset.tier = tierId;
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('drag-over'); const id=+e.dataTransfer.getData('text/plain'); if(id) moveItem(id,tierId); });
    zone.addEventListener('click', (e)=>{
      if(e.target.closest('.item')) return;
      if(selectedId!=null) moveItem(selectedId, tierId);
    });
  }

  function render(){
    board.innerHTML = '';
    for(const t of TIERS){
      const row = document.createElement('div'); row.className='tier';
      const lab = document.createElement('div'); lab.className='tier-label'; lab.style.background=t.color; lab.textContent=t.id;
      const zone = document.createElement('div'); zone.className='tier-items';
      bindDropZone(zone, t.id);
      tierItems(t.id).forEach(it=>zone.appendChild(itemEl(it)));
      row.append(lab, zone); board.appendChild(row);
    }
    pool.innerHTML='';
    tierItems('pool').forEach(it=>pool.appendChild(itemEl(it)));
    bindDropZone(pool, 'pool');
    draw();
  }

  // ---- export ----
  function wrapText(text, maxW, font, maxLines){
    ctx.font=font; const chars=[...text]; let lines=[], line='';
    for(const ch of chars){ const test=line+ch; if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=ch; if(lines.length===maxLines-1) break; } else line=test; }
    const consumed=lines.join('').length; let rest=chars.slice(consumed).join('');
    if(lines.length<maxLines) lines.push(rest); else { let last=lines[maxLines-1]; while(ctx.measureText(last+'…').width>maxW && last.length) last=last.slice(0,-1); if(chars.slice(consumed+last.length).length) last+='…'; lines[maxLines-1]=last; }
    return lines;
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function draw(){
    const W=1080; const pad=44; const labelW=130; const rowH=140; const gap=0; const headerH=170; const footerH=70;
    const tiersH = TIERS.length * rowH;
    const poolItems = tierItems('pool');
    const poolH = poolItems.length ? 160 : 0;
    const H = Math.max(900, headerH + tiersH + poolH + footerH + pad*2);
    canvas.width=W; canvas.height=H;

    // bg
    const bg = ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#191610'); bg.addColorStop(.45,'#0b0b0f'); bg.addColorStop(1,'#121018');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // title
    ctx.fillStyle='#e8c468'; ctx.font='700 22px "Hiragino Sans","Noto Sans JP",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('TIER LIST', W/2, 46);
    ctx.fillStyle='#f2efe8'; ctx.font='700 56px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif';
    ctx.fillText((titleInput.value.trim()||'映画ティア表'), W/2, 78);

    const boardX=pad, boardY=headerH, boardW=W-pad*2;
    // board border
    ctx.save(); rr(boardX,boardY,boardW,tiersH,16); ctx.clip();
    TIERS.forEach((t, idx)=>{
      const y=boardY+idx*rowH;
      // label
      ctx.fillStyle=t.color; ctx.fillRect(boardX,y,labelW,rowH);
      ctx.fillStyle='#151515'; ctx.font='800 56px "Hiragino Mincho ProN","Yu Mincho","Georgia",serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(t.id, boardX+labelW/2, y+rowH/2+2);
      // items area
      ctx.fillStyle='#181820'; ctx.fillRect(boardX+labelW,y,boardW-labelW,rowH);
      // items
      const its = tierItems(t.id);
      const isz=104, igap=10; let ix=boardX+labelW+14, iy=y+(rowH-isz)/2;
      for(const it of its){
        if(ix+isz > boardX+boardW-10) { ix=boardX+labelW+14; /* overflow - keep simple: clip */ }
        ctx.save(); rr(ix,iy,isz,isz,10); ctx.clip();
        if(it.type==='image' && it.img){
          const iw=it.img.naturalWidth, ih=it.img.naturalHeight; const r=Math.max(isz/iw,isz/ih); const nw=iw*r, nh=ih*r;
          ctx.drawImage(it.img, ix+(isz-nw)/2, iy+(isz-nh)/2, nw, nh);
        } else {
          ctx.fillStyle='#2a2a38'; ctx.fillRect(ix,iy,isz,isz);
          ctx.fillStyle='#f2efe8'; ctx.textAlign='center'; ctx.textBaseline='middle';
          const font='700 20px "Hiragino Sans","Noto Sans JP",sans-serif';
          const lines=wrapText(it.text||'', isz-12, font, 3);
          const lh=24; const startY=iy+isz/2 - (lines.length-1)*lh/2;
          ctx.font=font; lines.forEach((ln,li)=>ctx.fillText(ln, ix+isz/2, startY+li*lh));
        }
        ctx.restore();
        ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2; rr(ix,iy,isz,isz,10); ctx.stroke();
        ix += isz+igap;
      }
      // row separator
      ctx.strokeStyle='#101015'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(boardX,y+rowH); ctx.lineTo(boardX+boardW,y+rowH); ctx.stroke();
    });
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=2; rr(boardX,boardY,boardW,tiersH,16); ctx.stroke();

    // pool (if any) - draw below
    if(poolItems.length){
      const py = boardY+tiersH+24;
      ctx.fillStyle='rgba(242,239,232,.55)'; ctx.font='600 22px "Hiragino Sans","Noto Sans JP",sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('未分類', boardX, py);
      const isz=88, igap=10; let ix=boardX, iy=py+36;
      for(const it of poolItems){
        if(ix+isz>boardX+boardW){ ix=boardX; iy+=isz+igap; }
        ctx.save(); rr(ix,iy,isz,isz,10); ctx.clip();
        if(it.type==='image' && it.img){
          const iw=it.img.naturalWidth, ih=it.img.naturalHeight; const r=Math.max(isz/iw,isz/ih); const nw=iw*r, nh=ih*r;
          ctx.drawImage(it.img, ix+(isz-nw)/2, iy+(isz-nh)/2, nw, nh);
        } else {
          ctx.fillStyle='#2a2a38'; ctx.fillRect(ix,iy,isz,isz);
          ctx.fillStyle='#f2efe8'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='700 18px "Hiragino Sans","Noto Sans JP",sans-serif';
          const lines=wrapText(it.text||'', isz-10, '700 18px "Hiragino Sans","Noto Sans JP",sans-serif', 3);
          const lh=22; const sy=iy+isz/2-(lines.length-1)*lh/2; lines.forEach((ln,li)=>ctx.fillText(ln,ix+isz/2,sy+li*lh));
        }
        ctx.restore();
        ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2; rr(ix,iy,isz,isz,10); ctx.stroke();
        ix += isz+igap;
      }
    }

    ctx.fillStyle='rgba(242,239,232,.42)'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.font='500 24px "Hiragino Sans","Noto Sans JP",sans-serif';
    ctx.fillText('made with EigaKit', W/2, H-28);

    const t = encodeURIComponent(`${titleInput.value.trim()||'映画ティア表'} を作った！\n\n#映画ティア表 #EigaKit #映画好きと繋がりたい`);
    const url = encodeURIComponent(location.href.replace(/\/app\/tier\/.*$/, '/app/tier/'));
    share.href = `https://x.com/intent/post?text=${t}&url=${url}`;
  }

  document.getElementById('dl').addEventListener('click', ()=>{ const a=document.createElement('a'); a.download='eigakit-tier.png'; a.href=canvas.toDataURL('image/png'); a.click(); });
  render();

  // initial sample items for easier first experience? No, keep clean.
})();
</script>
</body>
</html>
