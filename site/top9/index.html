<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好きな映画9選｜CineCard</title>
<style>
:root{--bg:#0b0b0f;--panel:#17171e;--line:#2a2a35;--text:#f2efe8;--muted:#a8a39a;--accent:#e8c468;--accent2:#ff7a59;--sans:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif}
*,*::before,*::after{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#2a2112,transparent 60%),var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6}
.wrap{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:28px 0 40px}
.top h1{font-family:var(--serif);font-size:clamp(1.8rem,5vw,3rem);margin:.2em 0 .2em;line-height:1.2}
.top p{color:var(--muted);margin:0 0 24px}
.layout{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px}
.panel h2{font-size:1rem;margin:0 0 14px;color:#ddd5c8}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.slot-img{aspect-ratio:2/3;background:linear-gradient(160deg,#242430,#15151c);display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.slot-img img{width:100%;height:100%;object-fit:cover;display:block}
.slot-img .ph{color:#8f887d;font-size:.82rem;text-align:center;padding:16px;line-height:1.5}
.slot-img .ph strong{display:block;font-size:1.6rem;color:rgba(232,196,104,.7);margin-bottom:6px;font-family:var(--serif)}
.slot-img input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot-img .ctrl{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:3}
.slot-img .ctrl button{width:28px;height:28px;border-radius:8px;border:none;background:rgba(0,0,0,.62);color:#fff;font-size:14px;cursor:pointer;line-height:1}
.slot-img .ctrl button:active{transform:scale(.96)}
.slot.dragging{opacity:.45}
.slot-img .drag-hint{position:absolute;left:6px;top:6px;z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 6px;border-radius:7px}
.slot-body{padding:12px}
.slot-body label{display:block;font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.slot-body input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0f0f14;color:var(--text);font:inherit;font-size:.95rem}
.slot-body input[type=text]:focus{outline:2px solid rgba(232,196,104,.45);border-color:rgba(232,196,104,.5)}
.name-row{margin-bottom:18px}
.name-row label{display:block;font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.name-row input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0f0f14;color:var(--text);font:inherit}
.name-row input:focus{outline:2px solid rgba(232,196,104,.45);border-color:rgba(232,196,104,.5)}
.preview{position:sticky;top:20px}
.canvas-wrap{background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:#0b0b0f}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 16px;border-radius:999px;border:1px solid transparent;font:700 .92rem var(--sans);cursor:pointer;text-decoration:none;transition:transform .15s,opacity .2s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#f0d78a);color:#1a1408}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text);border-color:rgba(255,255,255,.12)}
.small{font-size:.78rem;color:var(--muted);margin-top:10px;line-height:1.6}
@media (max-width:900px){.layout{grid-template-columns:1fr}.preview{position:static}}
@media (max-width:520px){.grid4{grid-template-columns:repeat(3,1fr);gap:8px}.slot-body{padding:8px}.slot-body input[type=text]{font-size:.82rem;padding:8px}.panel{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p style="color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin:0">CineCard Template</p>
    <h1>好きな映画9選</h1>
    <p>あなたの「好き」を9枚で語るポスターをつくろう。画像は端末内で処理され、サーバーには送信されません。</p>
  </div>

  <div class="layout">
    <div class="panel">
      <div id="themePicker"></div>
      <div class="name-row">
        <label for="owner">名前・ハンドル（任意）</label>
        <input id="owner" type="text" maxlength="30" placeholder="例：@your_name / あなたの名前">
      </div>
      <h2>9本の映画を選ぶ</h2>
      <div class="grid4" id="slots"></div>
      <div id="slotSearchBox" style="margin-top:14px;display:none">
        <div style="font-size:.82rem;color:var(--muted);margin-bottom:8px" id="slotSearchLabel"></div>
        <div style="display:flex;gap:8px">
          <input id="slotSearchInput" type="text" maxlength="40" placeholder="映画タイトルを入力して検索" style="flex:1;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0f0f14;color:var(--text);font:inherit">
          <button class="btn btn-primary btn-sm" id="slotSearchGo" type="button" style="padding:10px 14px;border-radius:12px">検索</button>
        </div>
      </div>
      <div id="slotSearchStatus" style="font-size:.82rem;color:var(--muted);margin-top:8px;min-height:1.2em"></div>
      <div id="slotSearchResults" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px"></div>
    </div>

    <div class="preview">
      <div class="panel">
        <h2>プレビュー</h2>
        <div class="canvas-wrap"><canvas id="c" width="1080" height="1350"></canvas></div>
        <div class="actions">
          <button class="btn btn-primary" id="dl" type="button">画像を保存</button>
          <a class="btn btn-ghost" id="share" href="#" target="_blank" rel="noopener">Xでシェア</a>
        </div>
       
      </div>
    </div>
  </div>
</div>

<script src="../../assets/cinecard-config.js"></script>
<script src="../../assets/movie-search.js"></script>
<script src="../../assets/themes.js"></script>
<script>
(() => {
  const slotsEl = document.getElementById('slots');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const owner = document.getElementById('owner');
  const dl = document.getElementById('dl');
  const share = document.getElementById('share');
  const W = 1080; let H = 1750;
  const state = Array.from({length:9}, () => ({ title:'', img:null, src:'' }));
  let theme = (window.CineCardThemes && window.CineCardThemes.byId['cinema-dark']) || {id:'cinema-dark',bg:['#1c1912','#0b0b0f','#15121a'],accent:'#e8c468',accent2:'#ff7a59',text:'#f2efe8',muted:'rgba(242,239,232,.62)',frame:'rgba(232,196,104,.22)',fontHead:'Georgia,serif',fontBody:'system-ui,sans-serif'};
  if (window.CineCardThemes) {
    window.CineCardThemes.mountPicker(document.getElementById('themePicker'), { initial: theme.id, onChange: (t) => { theme = t; render(); } });
  }
  let activeSlot = null;

  const slotEls = [];
  function refreshSlot(i){
    const s = state[i];
    const {imgBox, file} = slotEls[i];
    imgBox.querySelector('.ph')?.remove();
    imgBox.querySelector('img')?.remove();
    imgBox.querySelector('.ctrl')?.remove();
    imgBox.querySelector('.drag-hint')?.remove();
    if (s.src) {
      const imgEl = document.createElement('img');
      if (!s.src.startsWith('data:')) imgEl.crossOrigin = 'anonymous';
      imgEl.src = s.src; imgEl.alt = s.title || `映画${i+1}`;
      imgBox.appendChild(imgEl);
      const ctrl = document.createElement('div');
      ctrl.className = 'ctrl';
      ctrl.innerHTML = `<button type="button" data-act="clear" aria-label="削除">×</button>`;
      ctrl.addEventListener('click', (e) => {
        e.stopPropagation(); e.preventDefault();
        const act = e.target.closest('button')?.dataset.act;
        if (act === 'clear') { clearSlot(i); }
      });
      imgBox.appendChild(ctrl);
      const hint = document.createElement('div'); hint.className='drag-hint'; hint.textContent='長押しで並べ替え';
      imgBox.appendChild(hint);
      file.style.pointerEvents = 'none';
    } else {
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.innerHTML = `<strong>${i+1}</strong>タップで画像追加<br>または下の検索`;
      imgBox.insertBefore(ph, file);
      file.style.pointerEvents = 'auto';
    }
  }
  function clearSlot(i){
    state[i] = { title:'', img:null, src:'' };
    refreshSlot(i); render();
  }
  function swapSlots(a,b){
    const tmp = state[a]; state[a] = state[b]; state[b] = tmp;
    refreshSlot(a); refreshSlot(b); render();
  }

  function makeSlot(i){
    const el = document.createElement('div');
    el.className = 'slot';
    el.innerHTML = `
        <div class="slot-img" draggable="false">
        <div class="ph"><strong>${i+1}</strong>タップで画像追加<br>または下の検索</div>
        <input type="file" accept="image/*" aria-label="映画${i+1}の画像をアップロード">
      </div>
      <div class="slot-body">
        <button type="button" class="btn btn-primary btn-sm search-btn" style="width:100%;padding:10px 10px;font-size:.82rem;border-radius:10px">映画を検索</button>
      </div>`;
    const file = el.querySelector('input[type=file]');
    const imgBox = el.querySelector('.slot-img');
    const searchBtn = el.querySelector('.search-btn');
    file.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const url = await readAsDataURL(f);
      const im = await loadImage(url);
      state[i] = { title: state[i].title || '', img: im, src: url };
      refreshSlot(i); render();
    });
    searchBtn.addEventListener('click', () => {
      activeSlot = i;
      const box = document.getElementById('slotSearchBox');
      const label = document.getElementById('slotSearchLabel');
      const input = document.getElementById('slotSearchInput');
      const status = document.getElementById('slotSearchStatus');
      const container = document.getElementById('slotSearchResults');
      box.style.display = 'block';
      label.textContent = `スロット ${i+1} に入れる映画を検索`;
      input.value = '';
      container.innerHTML = '';
      status.textContent = '';
      box.scrollIntoView({behavior:'smooth', block:'nearest'});
      input.focus();
    });

    // long-press drag reorder
    let pressTimer=null, dragging=false, startX=0, startY=0;
    imgBox.addEventListener('pointerdown', (e)=>{
      if (e.target.closest('.ctrl') || e.target.tagName==='INPUT') return;
      if (!state[i].src) return;
      startX=e.clientX; startY=e.clientY;
      pressTimer = setTimeout(()=>{ dragging=true; el.classList.add('dragging'); imgBox.style.touchAction='none'; try{imgBox.setPointerCapture(e.pointerId);}catch{} }, 350);
    });
    imgBox.addEventListener('pointermove', (e)=>{
      if (!pressTimer && !dragging) return;
      if (!dragging && (Math.abs(e.clientX-startX)>8 || Math.abs(e.clientY-startY)>8)) { clearTimeout(pressTimer); pressTimer=null; }
    });
    imgBox.addEventListener('pointerup', (e)=>{
      if (pressTimer) { clearTimeout(pressTimer); pressTimer=null; }
      if (!dragging) return;
      dragging=false; el.classList.remove('dragging'); imgBox.style.touchAction='';
      const hit = document.elementFromPoint(e.clientX,e.clientY);
      const slot = hit?.closest('.slot');
      if (slot) {
        const j = slotEls.findIndex(x=>x.el===slot);
        if (j!==-1 && j!==i) swapSlots(i,j);
      }
    });
    imgBox.addEventListener('pointercancel', ()=>{ if(pressTimer){clearTimeout(pressTimer);pressTimer=null;} dragging=false; el.classList.remove('dragging'); imgBox.style.touchAction=''; });
    imgBox.addEventListener('contextmenu', (e)=>{ if(state[i].src) e.preventDefault(); });

    slotsEl.appendChild(el);
    slotEls.push({el, imgBox, file});
  }
  for(let i=0;i<9;i++) makeSlot(i);

  function findNextEmpty(from) {
    for (let k = 0; k < 9; k++) { const j = (from + k) % 9; if (!state[j].img && !state[j].src) return j; }
    return -1;
  }
  async function runSlotSearch() {
    if (activeSlot == null || !window.CineCardMovieSearch) return;
    const q = document.getElementById('slotSearchInput').value.trim();
    const container = document.getElementById('slotSearchResults');
    const status = document.getElementById('slotSearchStatus');
    status.scrollIntoView({behavior:'smooth', block:'nearest'});
    await window.CineCardMovieSearch.inlineSearch({
      query: q, container, status,
      onPick: async (movie, cardEl) => {
        let target = (activeSlot != null && !state[activeSlot].img && !state[activeSlot].src) ? activeSlot : findNextEmpty(activeSlot ?? 0);
        if (target === -1) { status.textContent = '空きスロットがありません。先に削除してください。'; return; }
        state[target].title = movie.year ? `${movie.title} (${movie.year})` : movie.title;
        if (movie.poster) {
          try {
            const im = await loadImage(movie.poster, 'anonymous');
            state[target].img = im; state[target].src = movie.poster;
          } catch (e) { console.warn('poster load failed', e); }
        }
        refreshSlot(target);
        if (cardEl) { cardEl.style.outline = '2px solid #e8c468'; cardEl.style.opacity = '0.55'; cardEl.disabled = true; }
        activeSlot = findNextEmpty(target);
        status.textContent = `「${movie.title}」をスロット ${target+1} に追加` + (activeSlot === -1 ? '（空きなし）' : ` / 次: スロット ${activeSlot+1}`);
        render();
      }
    });
  }
  document.getElementById('slotSearchGo').addEventListener('click', runSlotSearch);
  document.getElementById('slotSearchInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); runSlotSearch(); } });

  function readAsDataURL(file){
    return new Promise((res, rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  }
  function loadImage(src, crossOrigin){
    return new Promise((res, rej)=>{ const i=new Image(); if(crossOrigin) i.crossOrigin=crossOrigin; i.onload=()=>res(i); i.onerror=rej; i.src=src; });
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function fitText(text, maxW, base, font, min=20){
    let size = base;
    ctx.font = `${font} ${size}px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif`;
    while(size > min && ctx.measureText(text).width > maxW){ size -= 2; ctx.font = `${font} ${size}px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif`; }
    return size;
  }
  function wrapTitle(text, maxW, fontSpec, maxLines=2){
    const chars = [...text];
    const lines = [];
    let line = '';
    for(const ch of chars){
      const test = line + ch;
      ctx.font = fontSpec;
      if(ctx.measureText(test).width > maxW && line){
        lines.push(line);
        line = ch;
        if(lines.length === maxLines-1) break;
      } else line = test;
    }
    const consumed = lines.join('').length;
    let rest = chars.slice(consumed).join('');
    if(lines.length < maxLines) lines.push(rest);
    else { let last=lines[maxLines-1]; while(ctx.measureText(last+'…').width>maxW && last.length) last=last.slice(0,-1); if(chars.slice(consumed+last.length).length) last+='…'; lines[maxLines-1]=last; }
    return lines.filter(Boolean);
  }

  function drawPoster(i, x, y, w, h){
    const s = state[i];
    const t = theme;
    ctx.save();
    roundRect(x,y,w,h,18); ctx.clip();
    const g = ctx.createLinearGradient(x,y,x+w,y+h);
    g.addColorStop(0,t.bg[2]||t.bg[1]||'#262633'); g.addColorStop(1,t.bg[1]||'#14141b');
    ctx.fillStyle = g; ctx.fillRect(x,y,w,h);
    if(s.img){
      const iw=s.img.naturalWidth, ih=s.img.naturalHeight;
      const r=Math.max(w/iw,h/ih);
      const nw=iw*r, nh=ih*r;
      ctx.drawImage(s.img, x+(w-nw)/2, y+(h-nh)/2, nw, nh);
    } else {
      ctx.fillStyle = t.accent+'14';
      ctx.fillRect(x,y,w,h);
      ctx.fillStyle = t.accent+'99';
      ctx.font = `700 72px ${t.fontHead}`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(i+1), x+w/2, y+h/2 - 20);
      ctx.fillStyle = t.muted;
      ctx.font = `500 24px ${t.fontBody}`;
      ctx.fillText('NO POSTER', x+w/2, y+h/2 + 42);
    }
    const bg2 = ctx.createLinearGradient(x,y+h-180,x,y+h);
    bg2.addColorStop(0,'rgba(0,0,0,0)'); bg2.addColorStop(1,'rgba(0,0,0,.72)');
    ctx.fillStyle = bg2; ctx.fillRect(x,y+h-180,w,180);
    ctx.restore();

    ctx.save(); roundRect(x,y,w,h,18); ctx.strokeStyle=t.frame; ctx.lineWidth=2; ctx.stroke(); ctx.restore();

    // タイトル表示なし（ポスターのみ）
  }

  function render(){
    const t = theme;
    ctx.clearRect(0,0,W,H);
    const bg = ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,t.bg[0]); bg.addColorStop(.45,t.bg[1]||t.bg[0]); bg.addColorStop(1,t.bg[2]||t.bg[1]||t.bg[0]);
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    const rg1 = ctx.createRadialGradient(180,120,10,180,120,420); rg1.addColorStop(0,t.accent+'22'); rg1.addColorStop(1,t.accent+'00');
    ctx.fillStyle=rg1; ctx.fillRect(0,0,W,H);
    const rg2 = ctx.createRadialGradient(920,1180,10,920,1180,480); rg2.addColorStop(0,(t.accent2||t.accent)+'1f'); rg2.addColorStop(1,(t.accent2||t.accent)+'00');
    ctx.fillStyle=rg2; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=t.frame; ctx.lineWidth=2; roundRect(36,36,W-72,H-72,28); ctx.stroke();

    ctx.fillStyle = t.accent;
    ctx.font = `700 24px ${t.fontBody}`;
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('MY FAVORITE 4 FILMS', W/2, 64);

    ctx.fillStyle = t.text;
    ctx.font = `700 68px ${t.fontHead}`;
    ctx.fillText('好きな映画9選', W/2, 106);

    const name = owner.value.trim();
    if(name){
      ctx.fillStyle = t.muted;
      ctx.font = `500 30px ${t.fontBody}`;
      ctx.fillText(name, W/2, 190);
    }

    const cols = 3, rows = 3, pad = 56, gap = 22, topY = name ? 245 : 225;
    const cellW = (W - pad*2 - gap*(cols-1)) / cols;
    const cellH = Math.round(cellW * 1.48);
    H = topY + rows*cellH + (rows-1)*gap + 90;
    canvas.width = W; canvas.height = H;
    // repaint bg after resize
    const bg2 = ctx.createLinearGradient(0,0,W,H);
    bg2.addColorStop(0,t.bg[0]); bg2.addColorStop(.45,t.bg[1]||t.bg[0]); bg2.addColorStop(1,t.bg[2]||t.bg[1]||t.bg[0]);
    ctx.fillStyle = bg2; ctx.fillRect(0,0,W,H);
    const rg1b = ctx.createRadialGradient(180,120,10,180,120,420); rg1b.addColorStop(0,t.accent+'22'); rg1b.addColorStop(1,t.accent+'00');
    ctx.fillStyle=rg1b; ctx.fillRect(0,0,W,H);
    const rg2b = ctx.createRadialGradient(920,H-150,10,920,H-150,480); rg2b.addColorStop(0,(t.accent2||t.accent)+'1f'); rg2b.addColorStop(1,(t.accent2||t.accent)+'00');
    ctx.fillStyle=rg2b; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=t.frame; ctx.lineWidth=2; roundRect(36,36,W-72,H-72,28); ctx.stroke();
    ctx.fillStyle = t.accent; ctx.font = `700 24px ${t.fontBody}`; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText('MY FAVORITE 9 FILMS', W/2, 64);
    ctx.fillStyle = t.text; ctx.font = `700 68px ${t.fontHead}`; ctx.fillText('好きな映画9選', W/2, 106);
    if(name){ ctx.fillStyle = t.muted; ctx.font = `500 30px ${t.fontBody}`; ctx.fillText(name, W/2, 190); }
    for(let i=0;i<9;i++){
      const col = i%cols, row = Math.floor(i/cols);
      const x = pad + col*(cellW+gap);
      const y = topY + row*(cellH+gap);
      drawPoster(i, x, y, cellW, cellH);
    }

    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillStyle = t.muted;
    ctx.font = `500 24px ${t.fontBody}`;
    ctx.fillText('made with CineCard', W/2, H - 44);

    const text = encodeURIComponent(`私の好きな映画9選\n\n${state.map((s,i)=>`${i+1}. ${s.title.trim()||'—'}`).join('\n')}\n\n#好きな映画9選 #CineCard`);
    const url = encodeURIComponent(location.href.replace(/\/app\/top9\/.*$/, '/app/top9/'));
    share.href = `https://x.com/intent/post?text=${text}&url=${url}`;
  }

  owner.addEventListener('input', render);
  dl.addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'cinecard-top9.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  render();
})();
</script>
</body>
</html>
